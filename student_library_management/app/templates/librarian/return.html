{% extends "base.html" %}

{% block title %}Return Book{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-6">
    <div class="card shadow-sm p-4">
      <div class="text-center mb-4">
        <div class="display-5 text-success mb-2"><i class="bi bi-box-arrow-in-left"></i></div>
        <h3 class="fw-bold">Receive Returned Book</h3>
        <p class="text-muted small">Scan or enter the book copy accession number to process return and calculate any overdue fine automatically</p>
      </div>

      <form method="POST" action="{{ url_for('librarian.return_book') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="mb-4">
          <label for="accession_number" class="form-label fw-semibold">Book Copy Accession Barcode <span class="text-danger">*</span></label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-upc-scan"></i></span>
            <input type="text" class="form-control font-monospace" id="accession_number" name="accession_number" required placeholder="e.g. 97801-0001-001" autofocus>
          </div>
        </div>

        <button type="submit" class="btn btn-success w-100 py-2 fw-semibold">
          <i class="bi bi-check2-circle me-1"></i> Confirm Book Return
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
