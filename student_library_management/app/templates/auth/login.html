{% extends "base.html" %}

{% block title %}Sign In{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm p-4">
      <div class="text-center mb-4">
        <div class="display-5 text-warning mb-2"><i class="bi bi-person-lock"></i></div>
        <h3 class="fw-bold">Sign In to Your Account</h3>
        <p class="text-muted small">Enter your credentials to access the library system</p>
      </div>

      <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="mb-3">
          <label for="email" class="form-label fw-semibold">Email address</label>
          <input type="email" class="form-control" id="email" name="email" value="{{ email or '' }}" required autofocus placeholder="name@domain.edu">
        </div>

        <div class="mb-3">
          <label for="password" class="form-label fw-semibold">Password</label>
          <input type="password" class="form-control" id="password" name="password" required placeholder="••••••••">
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="remember" name="remember">
            <label class="form-check-label small" for="remember">Remember me</label>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3">Sign In</button>
      </form>

      <!-- Quick Demo Accounts Helper -->
      <div class="border-top pt-3 mt-2">
        <span class="text-muted small d-block mb-2 text-center">Quick One-Click Demo Credentials:</span>
        <div class="d-flex flex-wrap gap-2 justify-content-center">
          <button type="button" class="btn btn-sm btn-outline-danger quick-demo-pill" onclick="fillCreds('admin@library.edu', 'Pass1234')">
            <i class="bi bi-shield-shaded me-1"></i> Admin
          </button>
          <button type="button" class="btn btn-sm btn-outline-warning text-dark quick-demo-pill" onclick="fillCreds('librarian@library.edu', 'Pass1234')">
            <i class="bi bi-book me-1"></i> Librarian
          </button>
          <button type="button" class="btn btn-sm btn-outline-primary quick-demo-pill" onclick="fillCreds('alice@student.edu', 'Pass1234')">
            <i class="bi bi-mortarboard me-1"></i> Student
          </button>
        </div>
      </div>

      <div class="text-center mt-4 pt-2 border-top">
        <p class="small text-muted mb-0">Don't have an account? <a href="{{ url_for('auth.register') }}" class="fw-semibold">Register here</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function fillCreds(email, pwd) {
  document.getElementById('email').value = email;
  document.getElementById('password').value = pwd;
}
</script>
{% endblock %}
