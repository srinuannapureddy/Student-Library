{% extends "base.html" %}

{% block title %}Create Staff Account{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-6">
    <div class="card shadow-sm p-4">
      <div class="text-center mb-4">
        <div class="display-5 text-warning mb-2"><i class="bi bi-person-gear"></i></div>
        <h3 class="fw-bold">Create Staff / Admin Account</h3>
        <p class="text-muted small">Provision library staff or administrative user accounts</p>
      </div>

      <form method="POST" action="{{ url_for('admin.create_staff_user') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="mb-3">
          <label for="full_name" class="form-label fw-semibold">Full Name <span class="text-danger">*</span></label>
          <input type="text" class="form-control" id="full_name" name="full_name" value="{{ full_name or '' }}" required placeholder="e.g. John Doe">
        </div>

        <div class="mb-3">
          <label for="email" class="form-label fw-semibold">Email address <span class="text-danger">*</span></label>
          <input type="email" class="form-control" id="email" name="email" value="{{ email or '' }}" required placeholder="staff@library.edu">
        </div>

        <div class="mb-3">
          <label for="role" class="form-label fw-semibold">System Role <span class="text-danger">*</span></label>
          <select name="role" id="role" class="form-select" required>
            <option value="librarian" {% if role == 'librarian' %}selected{% endif %}>Librarian (Circulation, Returns, Requests)</option>
            <option value="admin" {% if role == 'admin' %}selected{% endif %}>Administrator (Full System Control)</option>
            <option value="student" {% if role == 'student' %}selected{% endif %}>Student</option>
          </select>
        </div>

        <div class="mb-4">
          <label for="password" class="form-label fw-semibold">Initial Password <span class="text-danger">*</span></label>
          <input type="password" class="form-control" id="password" name="password" required placeholder="Minimum 8 characters, at least 1 letter and 1 digit">
        </div>

        <div class="d-flex gap-2">
          <a href="{{ url_for('admin.users') }}" class="btn btn-outline-secondary w-50">Cancel</a>
          <button type="submit" class="btn btn-warning w-50 fw-semibold">Create Account</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
