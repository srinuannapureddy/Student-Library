{% extends "base.html" %}

{% block title %}Library Settings{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card shadow-sm p-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h3 class="fw-bold mb-0"><i class="bi bi-sliders me-2 text-primary"></i>System & Library Settings</h3>
          <p class="text-muted small">Configure default lending policies, fines, and student loan quotas</p>
        </div>
      </div>

      <form method="POST" action="{{ url_for('admin.settings') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        {% for key, info in settings.items() %}
          <div class="mb-4 pb-3 border-bottom">
            <label for="{{ key }}" class="form-label fw-bold text-dark mb-1">
              {{ key|replace('_', ' ')|title }}
            </label>
            <p class="text-muted small mb-2">{{ info.description }}</p>
            <input type="text" class="form-control" id="{{ key }}" name="{{ key }}" value="{{ info.value }}" required>
          </div>
        {% endfor %}

        <div class="text-end">
          <button type="submit" class="btn btn-primary fw-semibold px-4">
            <i class="bi bi-check2-circle me-1"></i> Save Configuration
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
